# Publishes the repository to GitHub Pages so /game-a/ is playable at
# https://<user>.github.io/<repo>/game-a/
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Until that is done this workflow's deploy step will fail, which is why it
# only runs on changes to game-a/ or when started by hand.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'game-a/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
